name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update (example: v0.1.0)"
        required: true
        type: string
      verify_only:
        description: "Build and verify without publishing a release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      MGT_VITEST_MAX_WORKERS: "1"
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      target: ${{ steps.release_meta.outputs.target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Restore check acceleration cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/check-cache
          key: check-${{ runner.os }}-node26-npm12-v1-${{ hashFiles('package-lock.json', 'scripts/run-prettier.cjs', 'scripts/dev-build-cache.cjs', 'scripts/build.cjs') }}-${{ github.sha }}
          restore-keys: |
            check-${{ runner.os }}-node26-npm12-v1-${{ hashFiles('package-lock.json', 'scripts/run-prettier.cjs', 'scripts/dev-build-cache.cjs', 'scripts/build.cjs') }}-

      - name: Run checks
        run: npm run check

      - name: Resolve and verify release metadata
        id: release_meta
        shell: pwsh
        run: |
          $expectedRef = "refs/heads/${{ github.event.repository.default_branch }}"
          if ("${{ github.ref }}" -ne $expectedRef) {
            throw "Release workflow must run from '$expectedRef', not '${{ github.ref }}'."
          }

          $tag = "${{ inputs.tag_name }}"
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($tag -ne $expectedTag) {
            throw "Release tag '$tag' does not match package version '$version' (expected '$expectedTag')."
          }

          $notesPath = "docs/release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are missing: $notesPath"
          }

          $existingTags = @(git tag --list $tag)
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect existing tag '$tag'."
          }
          if ($existingTags -contains $tag) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -ne "${{ github.sha }}") {
              throw "Existing tag '$tag' points to $tagCommit, not ${{ github.sha }}."
            }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "target=${{ github.sha }}" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Verify built-in Hugging Face assets
        run: npm run verify:hf-assets

      - name: Build Windows release
        env:
          MGT_THIN_INSTALLER: "1"
          MGT_ALLOW_MISSING_FLUX_RUNNER: "1"
        run: npm run dist:win

      - name: Smoke test fresh install and upgrade
        run: node scripts/smoke-windows-installer.cjs

      - name: Verify updater metadata
        run: node scripts/verify-windows-update-metadata.cjs

      - name: Verify old-version upgrade and user file preservation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $previous | Out-Null
          gh release download v3.7.7 --repo "${{ github.repository }}" --pattern 'CarrotMangaTranslator-Setup-v3.7.7.exe' --pattern 'SHA256SUMS-windows.txt' --dir $previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous release.' }
          $line = (Get-Content -LiteralPath (Join-Path $previous 'SHA256SUMS-windows.txt') -Raw).Trim()
          if ($line -notmatch '^([a-f0-9]{64})  CarrotMangaTranslator-Setup-v3\.7\.7\.exe$') { throw 'Invalid previous-release checksum manifest.' }
          $expected = $Matches[1]
          $oldInstaller = Join-Path $previous 'CarrotMangaTranslator-Setup-v3.7.7.exe'
          if ((Get-FileHash -LiteralPath $oldInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Previous-release checksum mismatch.' }
          & .github/scripts/verify-update-upgrade.ps1 -PreviousInstaller $oldInstaller

      - name: Seal Windows release artifact
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ steps.release_meta.outputs.notes_path }}
        run: |
          $files = @(Get-ChildItem -Path "dist" -Filter "CarrotMangaTranslator-Setup-v*.exe")
          if ($files.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($files.Count)."
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName).Hash.ToLowerInvariant()
          $publishedArtifact = "CarrotMangaTranslator-Setup-$env:RELEASE_TAG.exe"
          "$hash  $publishedArtifact" | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
          Copy-Item -LiteralPath $env:RELEASE_NOTES_PATH -Destination dist/release-notes.md
          @{
            schemaVersion = 1
            repository = "${{ github.repository }}"
            commit = "${{ github.sha }}"
            ref = "${{ github.ref }}"
            runId = "${{ github.run_id }}"
            runAttempt = "${{ github.run_attempt }}"
            artifact = $files[0].Name
            publishedArtifact = $publishedArtifact
            updateMetadataSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/latest.yml).Hash.ToLowerInvariant()
            sha256 = $hash
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/windows-provenance.json

      - name: Upload sealed Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ steps.release_meta.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/CarrotMangaTranslator-Setup-v*.exe
            dist/latest.yml
            dist/SHA256SUMS-windows.txt
            dist/windows-provenance.json
            dist/release-notes.md

      - name: Preserve upgrade verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-update-verification-${{ steps.release_meta.outputs.tag }}
          path: .tmp/update-upgrade-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' && !inputs.verify_only }}
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download sealed Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-${{ needs.build.outputs.tag }}
          path: release-artifact

      - name: Verify sealed Windows artifact
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TARGET: ${{ needs.build.outputs.target }}
        run: |
          $files = @(Get-ChildItem -Path "release-artifact" -Filter "CarrotMangaTranslator-Setup-v*.exe")
          if ($files.Count -ne 1) {
            throw "Expected exactly one sealed Windows installer, found $($files.Count)."
          }
          $line = (Get-Content -LiteralPath release-artifact/SHA256SUMS-windows.txt -Encoding ascii -Raw).Trim()
          if ($line -notmatch '^([a-f0-9]{64})  (.+\.exe)$') { throw "Invalid Windows checksum manifest." }
          $expected = $Matches[1]
          $fileName = $Matches[2]
          $publishedArtifact = "CarrotMangaTranslator-Setup-$env:RELEASE_TAG.exe"
          if ($fileName -ne $publishedArtifact) { throw "Windows checksum manifest names an unexpected release asset." }
          $provenance = Get-Content -LiteralPath release-artifact/windows-provenance.json -Encoding utf8 -Raw | ConvertFrom-Json
          if ($provenance.artifact -ne $files[0].Name) { throw "Windows provenance names an unexpected sealed installer." }
          if ($provenance.publishedArtifact -ne $publishedArtifact) { throw "Windows provenance names an unexpected published asset." }
          if ($provenance.sha256 -ne $expected) { throw "Windows provenance checksum does not match the checksum manifest." }
          if ($provenance.commit -ne $env:RELEASE_TARGET) { throw "Windows provenance commit does not match the release target." }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Windows release artifact checksum mismatch." }
          $metadataHash = (Get-FileHash -Algorithm SHA256 -LiteralPath release-artifact/latest.yml).Hash.ToLowerInvariant()
          if ($metadataHash -ne $provenance.updateMetadataSha256) { throw "Windows update metadata checksum mismatch." }

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TARGET: ${{ needs.build.outputs.target }}
          RELEASE_NOTES_PATH: release-artifact/release-notes.md
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          function Get-GitHubApiStatusCode {
            param([Parameter(Mandatory = $true)] $ErrorRecord)

            if ($null -eq $ErrorRecord.Exception.Response) {
              return 0
            }
            try {
              return [int]$ErrorRecord.Exception.Response.StatusCode
            } catch {
              return 0
            }
          }
          function Invoke-GitHubApiWithRetry {
            param(
              [Parameter(Mandatory = $true)] [string] $Uri,
              [string] $Method = "Get",
              [Parameter(Mandatory = $true)] [hashtable] $Headers,
              [string] $Body,
              [string] $ContentType,
              [string] $InFile,
              [int] $TimeoutSec = 100,
              [string] $RecoveryUri
            )

            $maximumAttempts = 6
            $retryableStatusCodes = @(0, 408, 429, 500, 502, 503, 504)
            for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
              $request = @{
                Uri = $Uri
                Method = $Method
                Headers = $Headers
                TimeoutSec = $TimeoutSec
                ErrorAction = "Stop"
              }
              if ($PSBoundParameters.ContainsKey("Body")) { $request.Body = $Body }
              if ($PSBoundParameters.ContainsKey("ContentType")) { $request.ContentType = $ContentType }
              if ($PSBoundParameters.ContainsKey("InFile")) { $request.InFile = $InFile }

              try {
                return Invoke-RestMethod @request
              } catch {
                $statusCode = Get-GitHubApiStatusCode $_
                $canRecoverCreatedRelease = $RecoveryUri -and (
                  $statusCode -eq 422 -or $retryableStatusCodes -contains $statusCode
                )
                if ($canRecoverCreatedRelease) {
                  try {
                    return Invoke-RestMethod -Method Get -Uri $RecoveryUri -Headers $Headers -TimeoutSec $TimeoutSec -ErrorAction Stop
                  } catch {
                    $recoveryStatusCode = Get-GitHubApiStatusCode $_
                    if ($recoveryStatusCode -ne 404 -and $retryableStatusCodes -notcontains $recoveryStatusCode) {
                      throw
                    }
                  }
                }

                $isRetryable = $retryableStatusCodes -contains $statusCode -or (
                  $RecoveryUri -and $statusCode -eq 422
                )
                if (-not $isRetryable -or $attempt -eq $maximumAttempts) {
                  throw
                }
                $delaySeconds = [int][Math]::Min(30, 5 * [Math]::Pow(2, $attempt - 1))
                Write-Warning "GitHub API returned HTTP $statusCode for $Method $Uri (attempt $attempt/$maximumAttempts); retrying in $delaySeconds seconds."
                Start-Sleep -Seconds $delaySeconds
              }
            }
          }
          $owner = "${{ github.repository_owner }}"
          $repo = "${{ github.event.repository.name }}"
          $encodedTag = [uri]::EscapeDataString($env:RELEASE_TAG)
          $releaseByTagUri = "https://api.github.com/repos/$owner/$repo/releases/tags/$encodedTag"
          $releaseNotes = Get-Content -Raw -LiteralPath $env:RELEASE_NOTES_PATH
          $policyUrl = "https://github.com/$owner/$repo/blob/$env:RELEASE_TARGET/CODE_SIGNING_POLICY.md"
          if ($releaseNotes -notmatch '(?im)\[Code signing policy\]\(') {
            $releaseNotes = "$($releaseNotes.TrimEnd())`n`n---`n`n[Code signing policy]($policyUrl)`n"
          }
          $releaseBody = @{
            tag_name = $env:RELEASE_TAG
            target_commitish = $env:RELEASE_TARGET
            name = $env:RELEASE_TAG
            draft = $false
            prerelease = $false
            body = $releaseNotes
          } | ConvertTo-Json
          $releaseUpdateBody = @{
            tag_name = $env:RELEASE_TAG
            target_commitish = $env:RELEASE_TARGET
            name = $env:RELEASE_TAG
            draft = $false
            prerelease = $false
            body = $releaseNotes
          } | ConvertTo-Json

          try {
            $release = Invoke-GitHubApiWithRetry -Uri $releaseByTagUri -Headers $headers
          } catch {
            $statusCode = Get-GitHubApiStatusCode $_
            if ($statusCode -ne 404) {
              throw
            }
            $release = Invoke-GitHubApiWithRetry -Method Post -Uri "https://api.github.com/repos/$owner/$repo/releases" -Headers $headers -Body $releaseBody -ContentType "application/json" -RecoveryUri $releaseByTagUri
          }

          $files = @(Get-ChildItem -Path "release-artifact" -Filter "CarrotMangaTranslator-Setup-v*.exe")
          if ($files.Count -ne 1) {
            throw "Expected exactly one Windows installer matching dist/CarrotMangaTranslator-Setup-v*.exe, found $($files.Count)."
          }

          $release = Invoke-GitHubApiWithRetry -Method Patch -Uri "https://api.github.com/repos/$owner/$repo/releases/$($release.id)" -Headers $headers -Body $releaseUpdateBody -ContentType "application/json"
          $uploadUrl = $release.upload_url -replace "\{\?name,label\}", ""
          # A complete installer and checksums must be remotely verified before advertising it.
          $assetNames = @("CarrotMangaTranslator-Setup-$env:RELEASE_TAG.exe", "SHA256SUMS-windows.txt", "windows-provenance.json", "latest.yml")
          $verifyRoot = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $verifyRoot | Out-Null
          foreach ($assetName in $assetNames) {
            $localPath = Join-Path "release-artifact" $assetName
            $localHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $localPath).Hash
            $localSize = (Get-Item -LiteralPath $localPath).Length
            $existing = @($release.assets | Where-Object { $_.name -eq $assetName })
            if ($existing.Count -gt 1) { throw "Duplicate release asset: $assetName" }
            if ($existing.Count -eq 1) {
              $asset = $existing[0]
            } else {
              $encodedName = [uri]::EscapeDataString($assetName)
              $asset = Invoke-RestMethod -Method Post -Uri "$($uploadUrl)?name=$encodedName" -Headers $headers -ContentType "application/octet-stream" -InFile $localPath -TimeoutSec 3600
            }
            if ($asset.size -ne $localSize) { throw "Published asset size differs: $assetName. Existing assets are never replaced." }
            $downloadHeaders = $headers.Clone()
            $downloadHeaders.Accept = "application/octet-stream"
            $verifiedPath = Join-Path $verifyRoot $assetName
            Invoke-WebRequest -Uri $asset.url -Headers $downloadHeaders -OutFile $verifiedPath -TimeoutSec 3600
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $verifiedPath).Hash -ne $localHash) { throw "Published asset checksum differs: $assetName. Existing assets are never replaced." }
            Write-Host "Verified published asset: $assetName ($localSize bytes)"
          }
